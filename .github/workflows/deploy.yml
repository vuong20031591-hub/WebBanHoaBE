name: WebBanHoaBE CI-CD

on:
  push:
    branches:
      - feat/test-deploy
  pull_request:
    branches:
      - feat/test-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webbanhoa-be-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x mvnw

      - name: Build and test backend
        shell: bash
        run: |
          set -o pipefail
          ATTEMPT=1
          MAX_ATTEMPTS=2
          until [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; do
            echo "Running Maven verify (attempt ${ATTEMPT}/${MAX_ATTEMPTS})"
            ./mvnw -B -ntp clean verify 2>&1 | tee build.log && break
            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "Maven verify failed after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Retrying Maven verify..."
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-test-reports
          path: |
            build.log
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

  docker-build-push:
    name: Build and push backend image
    runs-on: ubuntu-latest
    needs:
      - ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Validate Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret."
            exit 1
          fi

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          REPO_BASE="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "${{ secrets.DOCKER_IMAGE_BE }}" ]; then
            IMAGE_NAME="${{ secrets.DOCKER_IMAGE_BE }}"
          else
            IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${REPO_BASE}-be"
          fi
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
