spring.application.name=web-ban-hoa
spring.config.import=optional:file:.env[.properties]

# Base defaults for local development.
# Process environment variables always override these values.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/florastore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool defaults (override by env on each deployment target)
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:15000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:180000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway optimization
spring.flyway.enabled=true
spring.flyway.connect-retries=${DB_FLYWAY_CONNECT_RETRIES:5}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=${DB_FLYWAY_OUT_OF_ORDER:false}
spring.flyway.validate-on-migrate=false

spring.h2.console.enabled=false

server.error.include-message=always
server.error.include-stacktrace=never

# Mail (Gmail SMTP)
spring.mail.host=${MAIL_HOST:${EMAIL_HOST:}}
spring.mail.port=${MAIL_PORT:${EMAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${EMAIL_USER:}}
spring.mail.password=${MAIL_PASSWORD:${EMAIL_PASS:}}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:${EMAIL_SECURE:false}}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:${EMAIL_USER:}}}
app.mail.from-name=${MAIL_FROM_NAME:${EMAIL_FROM_NAME:}}

# Password Reset
auth.password-reset.code-expiry-minutes=${PASSWORD_RESET_CODE_EXPIRY_MINUTES:10}

# Security
security.admin-role-header=X-Role
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT Configuration (Custom)
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloudflare R2 Storage
r2.enabled=${R2_ENABLED:false}
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key=${R2_ACCESS_KEY:}
r2.secret-key=${R2_SECRET_KEY:}
r2.bucket=${R2_BUCKET:}
r2.region=${R2_REGION:auto}
r2.public-base-url=${R2_PUBLIC_BASE_URL:}

# VietQR Payment Gateway
payments.vietqr.api-base-url=${VIETQR_API_BASE_URL:https://api.vietqr.io}
payments.vietqr.client-id=${VIETQR_CLIENT_ID:}
payments.vietqr.api-key=${VIETQR_API_KEY:}
payments.vietqr.webhook-secret=${VIETQR_WEBHOOK_SECRET:}
payments.vietqr.signing-secret=${VIETQR_SIGNING_SECRET:}

# SePay Payment Gateway
payments.sepay.api-base-url=${SEPAY_API_BASE_URL:https://my.sepay.vn/userapi}
payments.sepay.api-token=${SEPAY_API_TOKEN:}
payments.sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
payments.sepay.signing-secret=${SEPAY_SIGNING_SECRET:}

# Bank Account Info
payments.bank.account-expected=${BANK_ACCOUNT_EXPECTED:}
payments.bank.account-number=${BANK_ACCOUNT_NUMBER:}
payments.bank.account-name=${BANK_ACCOUNT_NAME:}
payments.bank.name=${BANK_NAME:}
payments.bank.bin=${BANK_BIN:}

# Payment Settings
payments.qr.expiry-minutes=${PAYMENT_QR_EXPIRY_MINUTES:15}
payments.polling-interval-seconds=${PAYMENT_POLLING_INTERVAL:15}
payments.reminder-interval-seconds=${PAYMENT_REMINDER_INTERVAL:30}
payments.amount-tolerance=${PAYMENT_AMOUNT_TOLERANCE:0}

# Webhook Security
payments.webhook.ip-whitelist=${WEBHOOK_IP_WHITELIST:127.0.0.1,::1,::ffff:127.0.0.1}
payments.webhook.timestamp-tolerance-minutes=${WEBHOOK_TIMESTAMP_TOLERANCE:5}
payments.webhook.future-tolerance-minutes=${WEBHOOK_FUTURE_TOLERANCE:1}

