# Test profile override (isolated H2 in-memory)
spring.datasource.url=jdbc:h2:mem:flowerdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.flyway.enabled=false

spring.h2.console.enabled=false

# JWT Configuration for tests
jwt.secret=test-secret-key-for-integration-tests-minimum-256-bits-long-hmac-sha512-requirement
jwt.expiration-ms=3600000
